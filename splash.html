<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciando POS La Estampida...</title>
    <style>
        body { 
            background-color: #1a1a1a; 
            color: #fff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            height: 100vh; margin: 0; overflow: hidden;
        }
        /* Cambia 'public/logo.jpg' por la ruta de tu logo real */
        img { 
            width: 160px; height: 160px; border-radius: 50%; object-fit: cover;
            box-shadow: 0 0 20px #d35400; margin-bottom: 25px; 
            animation: pulse 1.5s infinite; 
        }
        @keyframes pulse { 
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(211, 84, 0, 0.7); } 
            70% { transform: scale(1); box-shadow: 0 0 0 15px rgba(211, 84, 0, 0); } 
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(211, 84, 0, 0); } 
        }
        .loader { 
            border: 4px solid #333; border-top: 4px solid #d35400; 
            border-radius: 50%; width: 35px; height: 35px; 
            animation: spin 1s linear infinite; margin-top: 15px; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h2 { margin: 0; font-weight: 900; letter-spacing: 1px; color: #d35400;}
        p { color: #bdc3c7; font-size: 14px; font-weight: bold; margin-top: 10px;}
    </style>
</head>
<body>
    <!-- Asegúrate de tener una imagen llamada logo.jpg en tu carpeta public -->
    <img src="public/logo.jpg" alt="Logo La Estampida" onerror="this.src='https://via.placeholder.com/160/1a1a1a/d35400?text=EST'">
    <h2>ASADERO LA ESTAMPIDA</h2>
    <p id="status-text">Iniciando base de datos...</p>
    <div class="loader" id="spinner"></div>

    <script>
        const statusText = document.getElementById('status-text');
        const spinner = document.getElementById('spinner');
        const messages = ["Levantando el motor del sistema...", "Conectando base de datos...", "Cargando catálogo de platillos...", "Preparando terminal de caja..."];
        let i = 0;
        
        // Cambia el texto más lento (cada 1.5 segundos)
        setInterval(() => { if (i < messages.length) { statusText.innerText = messages[i]; i++; } }, 1500);

        // Hace el ping al servidor más espaciado
        const checkServer = setInterval(() => {
            fetch('http://localhost:3000')
                .then(response => {
                    if (response.ok) {
                        clearInterval(checkServer);
                        statusText.innerText = "¡Sistema en línea! Abriendo caja...";
                        statusText.style.color = "#2ecc71";
                        spinner.style.display = "none";
                        
                        // EL TRUCO: Le damos 3.5 segundos de "respiro" al servidor 
                        // antes de obligar a Edge a mostrar la pantalla
                        setTimeout(() => {
                            window.resizeTo(screen.availWidth, screen.availHeight);
                            window.moveTo(0, 0);
                            window.location.replace('http://localhost:3000');
                        }, 3500); 
                    }
                }).catch(() => { /* Aún no carga, sigue intentando en silencio */ });
        }, 1500);
    </script>
</body>
</html>
